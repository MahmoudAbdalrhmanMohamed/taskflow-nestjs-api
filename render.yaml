services:
  - type: web
    name: taskflow-nestjs-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/src/main
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DEMO_USER_EMAIL
        value: demo@taskflow.dev
      - key: DEMO_USER_PASSWORD
        value: DemoPassword123!
      - key: DEMO_USER_NAME
        value: Alex Morgan

databases:
  - name: taskflow-postgres
    plan: free
    region: oregon
    databaseName: taskflow
    user: taskflow_user
